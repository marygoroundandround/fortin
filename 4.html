<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Tinitiny</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #efd0d7; /* Light pink */
      padding: 20px;
      margin: 0;
    }

    .message {
      font-size: 2rem;
      color: #000000;
      text-align: center;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .buttons button {
      padding: 12px 25px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .buttons button.accept {
      background-color: #ff69b4; /* pink */
      color: white;
    }

    .buttons button.accept:hover {
      transform: scale(1.05);
      background-color: #ff85c1;
    }

    .buttons button.decline {
      background-color: #eecce4;
      color: white;
    }

    .buttons button.decline:hover {
      transform: scale(1.05);
      background-color: #f8d3fd;
    }
  </style>
</head>
<body>
  <div class="message">uh uh You have to accept it mæm!</div>
  <p>😡😡😡😡😡😡😡😡😡😡😡😡😡😡😡😡</p>
  <div class="buttons">
    <button class="accept" onclick="location.href='3.html'">Accept</button>
    <button class="accept" onclick="location.href='3.html'">Accept</button>
  </div>
</body>
</html>
